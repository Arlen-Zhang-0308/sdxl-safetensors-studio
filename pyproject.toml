[project]
name = "sdxl-safetensors-studio"
version = "1.0.0"
description = "Windows local SDXL safetensors image generation studio"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "diffusers>=0.35,<1",
  "transformers>=4.48,<5",
  "accelerate>=1.2,<2",
  "safetensors>=0.5,<1",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
